# Data sources for the pipeline.
#
# Milestone 1 (data recon): verify each entry by hand in QGIS, then fill in the
# TODO fields and set verified = true. Don't write pipeline code against an
# unverified source.
#
# Fields:
#   url         landing page or direct download
#   local_path  where the extracted download lives, relative to repo root
#   format     as delivered (shp, gdb, gpkg, pbf, geojson, ...)
#   layer       layer/table name inside the download, if multi-layer
#   table       raw.<table> to load into (`shore load`); sources without it aren't loaded
#   load_srs    EPSG code to assign on load when the file's own CRS doesn't map to one
#   clip_to_study_area  load only features inside [study_area] bbox_3071
#   crs         as delivered (EPSG code)
#   license     license / terms of use, plus required attribution
#   retrieved   date downloaded for the current build (YYYY-MM-DD)
#   verified    true once inspected in QGIS during recon
#   notes       recon findings

[parcels]
name = "Wisconsin Statewide Parcel Map V12 (Dane County extract)"
publisher = "WI State Cartographer's Office / Dept. of Administration"
url = "https://www.sco.wisc.edu/parcels/data-county/#v1200"
local_path = "data/raw/parcels/V1200_Wisconsin_Parcels_DANE.gdb"
format = "gdb"      # Esri file geodatabase; read via GDAL OpenFileGDB driver
layer = "V1200_Wisconsin_Parcels_DANE"
table = "parcels"            # -> raw.parcels
geometry = "MultiPolygon"
crs = "EPSG:3071"   # NAD83(HARN) / WTM83, meters. Same as our analysis CRS, so no reprojection.
license = "Free of charge; no formal license. SCO asks users to complete their parcel feedback survey. Attribution: Wisconsin Statewide Parcel Map Initiative (V12), WI DOA / State Cartographer's Office"
# TODO(owner): fill out the SCO parcel feedback survey (linked from the data page).
retrieved = "2026-10-16"
verified = true
notes = """
218,857 parcels. Source county data loaded 2026-03-09 (LOADDATE); TAXROLLYEAR
mostly 2025 (a few 2026/2027).
Bounds (EPSG:3071): 533141, 263801 to 600599, 313653.

Owner names: OWNERNME1 is 100% populated, but 25,034 parcels (11%) carry the
placeholder 'NOT AVAILABLE' (owner withheld), in every city (7,467 in Madison).
(Corrected 2026-10-17; recon first said ~510.) Along the shore they're nearly all
taxable residential (PROPCLASS 1, no AUXCLASS). OWNERNME2 is 56% blank.

Useful classification fields:
  AUXCLASS: tax-exempt / special class codes (95% blank).
    X1 = federal  (USFWS, NPS, USPS, VA)
    X2 = state    (WI DNR, WI DOT, UW Regents, Corrections)
    X3 = county   (Dane County, Housing Authority, Parks)
    X4 = other exempt (cities/villages, etc.)
    W5-W8, AW = forest / special classes. TODO: look up in schema PDF.
    Inconsistent: only ~5% of City of Madison-owned parcels carry X4, and a
    private name appears under X1. Use it as a secondary signal, not the rule.
  PROPCLASS: 1=residential, 2=commercial, etc. Blank for most exempt parcels.
  PLACENAME: municipality of the parcel ('CITY OF MADISON', 60 distinct).
    Could cross-check the municipal boundary split.

Owner-name variety to handle in ownership_rules.csv:
  'DANE COUNTY' / 'DANE, COUNTY OF' / 'COUNTY OF DANE'
  'CITY OF MADISON ENGINEER STORMWATER UTILITY 533' (department suffixes)
  'MADISON, CITY OF' (inverted form, common outside Madison)
  'BOARD OF REGENTS OF UNIV OF WIS SYSTEM' / 'UNIV OF WIS REGENTS ...' / 'UW REGENTS ARBORETUM ...'
  'WI DNR' / 'STATE OF WISCONSIN DEPT OF NATURAL RESOURCES'
  HOAs: '... HOME OWNERS ASSOCIATION INC' / '... NEIGHBORHOOD ASSOCIATION INC'
  Beware false positives: 'DANE COUNTY GROWERS', 'BECKS ENTERPRISES OF DANE COUNTY LLC'.

Geometry recon (QGIS, Lake Wingra, 2026-10-16):
  - Lakes are NOT parceled; clicking the water returns nothing.
  - Road right-of-way is NOT parceled; streets are gaps between parcels.
  - Parcel edges follow the shore but sit a few meters inland of the OSM waterline
    (thin unparceled strip along Vilas Park). Measured in EPSG:3071 against the OSM
    waterline: 1.9, 2.6, 1.3, 1.1 m (max 2.6, mean ~1.7). Re-measure against DNR
    hydro, which is the line the pipeline actually uses.
  - Piers are not parceled.
  - Large holdings (UW Arboretum) are split along straight PLSS lines.
  - Vilas Park parcel: owner CITY OF MADISON, PROPCLASS=1, AUXCLASS=NULL, $0
    assessed, so PROPCLASS/AUXCLASS can't be trusted for public land.

Not a legal record of ownership; cite that in the methodology page.
Alternative source: Dane County open data portal (gis-countyofdane.opendata.arcgis.com).
Not needed. V12 is recent and complete.
"""

[hydro]
name = "WI DNR 24K Hydro (full file geodatabase)"
publisher = "Wisconsin DNR"
url = "https://data-wi-dnr.opendata.arcgis.com/datasets/24k-hydro-full-file-geodatabase"
local_path = "data/raw/hydro/WDNR_HYDRO_24K.gdb"
format = "gdb"
layer = "WD_HYDRO_WATERBODY_AR_24K"   # inside feature dataset WD_HYDRO_DATA_24K
table = "dnr_waterbody"
load_srs = "EPSG:3071"       # compound CRS (3071 + NAVD88) gets a junk SRID otherwise
clip_to_study_area = true    # statewide file
geometry = "MultiPolygon (Measured; M values dropped on read)"
crs = "EPSG:3071"   # compound with NAVD88 height; horizontal = EPSG:3071, same as parcels
# ogr2ogr assigns a custom SRID (900914) for the compound CRS; set 3071 on load.
license = "No license; DNR disclaimer only: 'informational purposes only ... user agrees to be bound by all disclaimers found here: https://dnr.wisconsin.gov/legal'. Attribution: Wisconsin DNR, 24K Hydrography"
retrieved = "2026-10-16"
verified = true
notes = """
Statewide. 1,295 waterbody polygons intersect the Dane parcel extent.
Key fields: WATERBODY_NAME, WATERBODY_WBIC (DNR waterbody ID), HYDROID, HYDROCODE,
HYDROTYPE, LANDLOCK_CODE, ORIG_HRZ_SRC_YR, ORIG_HRZ_SRC_DNOM_AMT (source scale).

HYDROTYPE has a coded domain ('WD_HYDRO WaterBody Type'): 602 Stream/River,
701 Backwater, 703 Flooded Excavation, 706 Lake/Pond, 707 Reservoir Flowage,
710 Unspecified Open Water (full list: 601-711 in the gdb domains).
HYDROCODE has NO domain. It looks like HYDROTYPE-ish prefix + a 1-digit suffix, but
the prefix doesn't always match HYDROTYPE (e.g. HYDROCODE 7061 with HYDROTYPE 710).
7062 = 271 small polygons (54 ha total, mostly HYDROTYPE 710). Meaning of the suffix
is unconfirmed. Doesn't matter: we filter on HYDROTYPE and use 24K for identity only.
Dane-extent mix: 706 Lake/Pond 67 polys 12,846 ha; 602 Stream/River 48 polys 5,573 ha;
710 Unspecified 1,163 polys ~530 ha (mostly small ponds).

Accuracy: 1,269 of 1,295 polygons are from 1:24,000 sources, mostly 1975-1983.
Expect larger parcel-vs-hydro offsets than parcel-vs-OSM.
QGIS recon (Lake Wingra, 2026-10-16): parcel edge to hydro edge is 12-25 m along
Vilas Park, and worse near the Wingra Creek outlet, where the polygon overlaps
parcels and misses water. Too inaccurate to assign shoreline to parcels: a tolerance
big enough to bridge it would catch the second row of parcels.
=> Use 24K hydro for identity (WBIC, official names) only, not geometry.
   Candidate geometry source: [hydro_county] below.

Reference polygons:
  Lake Wingra   WBIC 805000  136 ha    perimeter  8.8 km
  Lake Mendota  WBIC 805400  3,958 ha  perimeter 38.4 km (23.9 mi)
  Lake Monona   WBIC 804600  1,359 ha  perimeter 27.1 km
  Lake Waubesa  WBIC 803700  840 ha    perimeter 16.3 km
  Lake Kegonsa  WBIC 802600  1,295 ha  perimeter 16.5 km
  Yahara River  WBIC 798300  several polygons (river drawn as area)

Other layers in the gdb:
  WD_HYDRO_WATERBODY_WBIC_AR_24K: same water dissolved by WBIC; no names/types.
  WD_HYDRO_FLOWLINE_LN_24K / _WBIC_LN_24K: centerlines, for narrow named streams.
  WD_HYDRO_BANK_LN_24K: bank lines; Wingra's sum to 15.1 km vs 8.8 km perimeter.
    Meaning unclear. TODO: check the data dictionary before using.
"""

[hydro_county]
name = "Dane County Lakes and Ponds (polygons)"
publisher = "Dane County Land Information Office"
url = "https://gis-countyofdane.opendata.arcgis.com/"   # Water Resources category
rest_endpoint = "https://dcimapapps.danecounty.gov/arcgissrv/rest/services/DaneCountyBase/MapServer/10"
local_path = "data/raw/hydro_county/LakesPonds/LakesPonds.shp"
format = "shp"
layer = "LakesPonds"
table = "county_lakesponds"
load_srs = "EPSG:7599"       # ESRI .prj; tag the EPSG code explicitly
geometry = "Polygon"
crs = "EPSG:7599"   # NAD83(2011) / WISCRS Dane (ftUS). US survey FEET; must reproject to 3071.
# .prj is ESRI WKT; tag it with -a_srs EPSG:7599 on load so PostGIS gets a real SRID.
license = "Unclear. Metadata has a disclaimer only (fitness for use on requester; 'intended for cartographic use, general spatial analysis ... not site specific analysis'). The muni layer's metadata cites a 'License Agreement for Dane County Digital Geographic Data Sets' whose URL is dead (404, 2026-10-17). Owner decided not to pursue (2026-10-17). Attribution: Dane County Land Information Office"
retrieved = "2026-10-16"
source_date = "2026-01"   # "January 2026" on the portal
verified = true
notes = """
SHORELINE GEOMETRY SOURCE (replaces DNR 24K for geometry).
4,979 polygons. HYDTYPE: Lake 4308, River 392, Island 270. Only 183 have NAME.
Fields: DXFLAYER, HYDTYPE, HYDELEV, CARTOUSE, DATEMODIFE, NAME, DNRDesigna,
Shape_STAr / Shape_STLe (in sq ft / ft. Ignore; recompute in 3071).
Wide rivers ARE polygons (Yahara River: 14 polys, 482 ha).
HYDTYPE can be NULL: 9 polygons, including the main Yahara River polygon (202 ha,
NAME='Yahara River'). Don't filter on HYDTYPE alone or the Yahara disappears.

Islands (PostGIS recon 2026-10-17): Island polygons are LAND filling holes in water.
  252 of 270 fill a hole in a lake/river polygon (245 of 307 water holes match an
  island exactly); 15 are isolated (2.6 ha, probably islands in unmapped marsh);
  3 overlap water slightly. None are named.
  => Shoreline = ST_Boundary(ST_Union(water polygons)), interior rings included, so
  island shores come for free. Ignore the Island polygons themselves.
  ST_Union also dissolves water-water seams (verified at the Wingra / Murphy Creek
  outlet). NB: the Wingra Creek polygon is named "Murphy Creek" (its official name).

Alignment, re-measured (2026-10-17) on the unioned Wingra shoreline (9.17 km incl.
island rings, every 5 m) with distance to the nearest parcel POLYGON (0 = inside):
  51% of points lie inside a parcel; p50 0, p90 2.7, p95 3.8, p99 12.0 m; 97.2% within 5 m.
  The earlier "runs > 5 m" were mostly parcels extending into marsh/water, i.e. the
  hydro line runs INSIDE the parcel, which then clearly owns it. Distance to the parcel
  EDGE was the wrong metric. Remaining runs > 5 m (6 runs, 205 m):
    568331,287417  95 m, max 37  NE corner by the outlet: unparceled strip between
                                 water and road/path corridor => real ROW gap
    5 runs 15-35 m, max 6-13 m   hydro cuts a few m behind the parcel edge at small
                                 inlets (digitizing mismatch); ~10-15 m tolerance covers them
  Snapshots were rendered from PostGIS (scratch, not committed).

Lakes (in EPSG:3071):  area_ha  perimeter_km   (DNR 24K perimeter)
  Lake Wingra           139.3      9.15 (2 polys)   8.8
  Lake Mendota         3968.7     38.20            38.4
  Lake Monona          1365.4     26.39            27.1
  Lake Waubesa          844.3     17.94            16.3
  Lake Kegonsa         1297.8     16.04            16.5

Alignment vs. parcels (Lake Wingra outer shoreline, 8.02 km, sampled every 5 m):
  distance to nearest parcel edge: p50 1.6 m, p75 3.3, p90 6.6, p95 11.1, max 36.8
  within 2 m: 59%, 5 m: 85%, 10 m: 94%. Manual QGIS check: max 3.8 m along Vilas.
  Runs > 5 m to inspect in QGIS (EPSG:3071 x,y):
    568347,287412  ~120 m, max 36.8  Wingra Creek outlet (lake/river polygon seam)
    567581,286579  ~280 m, max 20.3  south shore, Arboretum (marsh?)
    566233,286844  ~120 m, max 33.0  west end
    566972,286555   ~85 m, max 15.4  south shore
Joins to DNR 24K by spatial overlap (names match for big lakes) to get WBIC.
"""

[streams_county]
name = "Dane County Rivers and Streams (lines)"
publisher = "Dane County Land Information Office"
url = "https://gis-countyofdane.opendata.arcgis.com/"   # Water Resources category
rest_endpoint = "https://dcimapapps.danecounty.gov/arcgissrv/rest/services/DaneCountyBase/MapServer/9"
local_path = "data/raw/hydro_county/RiversStreams/RiversStreams.shp"
format = "shp"
layer = "RiversStreams"
geometry = "LineString"
crs = "EPSG:7599"   # NAD83(2011) / WISCRS Dane (ftUS). Feet; reproject to 3071.
license = "Same as [hydro_county] (disclaimer only; county license agreement unconfirmed). Attribution: Dane County Land Information Office"
retrieved = "2026-10-16"
source_date = "2026-01"
verified = true     # PostGIS recon 2026-10-17
notes = """
26,455 lines. Fields: DXFLAYER, HYDTYPE, CARTOUSE, DATEMODIFI, NAME, DNRDesigna,
DNRDesig_1 (date), DNRDocketN.
HYDTYPE: Perennial Stream, Intermittent Stream, Hidden (Perennial|Intermittent) Stream
(culverted/underground), Apparent Drainage, Constructed Drainage, Fluctuating.
DXFLAYER: Stream, Hidden Stream, River, River Hidden, Approximate Stream, Lake or Pond.

Named lines: 71 distinct names, 933 km total.
  358 km run INSIDE water polygons (centerlines through lakes and wide rivers) => drop.
  575 km are line-only (no polygon): 438 km perennial, 121 km intermittent, ~15 km other.
  Two banks => ~1,150 km of bank, more than all lake shoreline combined.
  Biggest line-only: Sugar River 21 km (the rest is polygon), Mud Creek 20,
  Kittleson Valley Creek 20, Elvers Creek 19, Koshkonong Creek 18, Vermont Creek 18.
Unnamed lines (~25,000, mostly drainage/intermittent) are out of scope.
NOT USED for now (2026-10-17): line-only streams are excluded from the analysis.
Kept here for the revisit.
"""

[municipalities]
name = "Dane County Municipal Boundaries"
publisher = "Dane County Land Information Office"
url = "https://gis-countyofdane.opendata.arcgis.com/pages/boundaries"
local_path = "data/raw/municipalities/MunicipalBoundaries/MunicipalBoundaries.shp"
format = "shp"
layer = "MunicipalBoundaries"
table = "municipalities"
load_srs = "EPSG:7599"
geometry = "Polygon (some multipart; load as MultiPolygon)"
crs = "EPSG:7599"   # WISCRS Dane ftUS, ESRI .prj; tag with -a_srs EPSG:7599 and reproject to 3071
license = "Metadata: 'Data is copyright and licensed for use. Refer to the License Agreement for Dane County Digital Geographic Data Sets' (https://lio.countyofdane.com/pdf/licenseagreement.pdf, now 404). Owner decided not to pursue (2026-10-17). Attribution: Dane County Land Information Office"
retrieved = "2026-10-17"
verified = true     # PostGIS recon 2026-10-17
notes = """
60 features: 8 cities (C), 20 villages (V), 32 towns (T).
Fields: NAME ('City of Madison', display-ready), C_T_V (C/T/V), FIPSCODE, MUNITAXID.
A couple of geometries are invalid (ring self-intersections) => ST_MakeValid.
Reportedly updated weekly (annexations); record the retrieval date per build.

Coverage: the polygons TILE the county. Union = 1,237.1 sq mi, one part, no holes,
no overlaps > 100 m2. => ST_Union of this layer is the county clip mask; no separate
county boundary source needed.

Municipalities INCLUDE the lake water: Mendota is 96% City of Madison / 4% Town of
Westport; Monona 100% Madison; Waubesa Dunn 69% / Blooming Grove 30%; Kegonsa Dunn 61% /
Pleasant Springs 39%. So shore in e.g. Maple Bluff sits ON the line between Madison
water and Maple Bluff land. Test on Mendota (38 km, every 10 m): muni polygon at the
shoreline point vs. the adjacent parcel's PLACENAME disagree on ~6.4 km (17%), mostly
Maple Bluff / Middleton / Shorewood Hills shore labeled City of Madison.
=> Attribute municipality from the LAND side (adjacent parcel), not the line itself.
"""

[osm]
name = "OpenStreetMap Wisconsin extract"
publisher = "Geofabrik"
url = "https://download.geofabrik.de/north-america/us/wisconsin-latest.osm.pbf"
local_path = "data/raw/osm/wisconsin-latest.osm.pbf"   # + .md5 from Geofabrik (verified)
format = "pbf"
layer = "points, lines, multipolygons"   # GDAL OSM driver layers
table = "osm"                 # -> raw.osm_points / osm_lines / osm_multipolygons
crs = "EPSG:4326"
license = "ODbL 1.0 - attribution: (c) OpenStreetMap contributors"
retrieved = "2026-10-17"
verified = true     # PostGIS recon 2026-10-17 (GDAL OSM driver, Dane bbox)
notes = """
294 MB statewide. Filter with osmium to the Dane County bbox. GDAL's default
osmconf.ini puts most tags in other_tags (hstore text). Only multipolygons get a
leisure/natural column. Use a custom osmconf or osmium tags-filter in the pipeline.

Dane-wide counts (inside the muni-union mask):
  leisure=park 1,059 areas + 21 pts; leisure=nature_reserve 202 areas;
  natural=beach 43 areas; leisure=slipway 50 pts + 4 lines; man_made=pier 262 lines
  + 32 areas; leisure=fishing 1; leisure=beach_resort 0.
  access=* on parks is sparse but useful: 48 parks access=private (likely HOA),
  4 access=yes; 2 nature reserves private.
Lake Wingra (within 30 m of shore): Henry Vilas Park (operator City of Madison),
  Wingra Park, UW Arboretum (nature_reserve), Vilas Park Beach, swimming_area,
  Wingra Marina (leisure=marina), Wingra Boats (amenity=boat_rental), fishing pier,
  piers, Edgewood College (amenity=university). No slipway at Wingra.
Add to the access evidence list: leisure=marina, amenity=boat_rental,
  leisure=swimming_area, leisure=nature_reserve.
"""

[population]
name = "Official Final Population Estimates, 1/1/2026, Wisconsin Minor Civil Divisions"
publisher = "Wisconsin Department of Administration, Demographic Services Center"
url = "https://doa.wi.gov/DIR/Final_Ests_MCD_2026.xlsx"
landing = "https://doa.wi.gov/Pages/LocalGovtsGrants/Population_Estimates_Long.aspx"
local_path = "data/raw/population/Final_Ests_MCD_2026.xlsx"
format = "xlsx"
layer = "MCDPopulationEstimatebyCounty"
table = "population"         # -> raw.population (no geometry)
license = "Public data from a state agency; no license stated. Attribution: Wisconsin DOA Demographic Services Center"
retrieved = "2026-10-17"
verified = true
notes = """
One row per municipality x county part (a split municipality has a row per county;
'*' in Split). Rows 1-3 are a title, row 4 the header, so ogr2ogr loads generic
Field1..Field10 strings; staging parses them:
  Field1 DOA code, Field2 'C Madison' / 'V Maple Bluff' / 'T Dunn', Field4 county,
  Field5 final estimate 1/1/2026, Field6 Census 2020.
Chosen over Census 2020 because DOA estimates follow current boundaries (the Town of
Madison was dissolved into Madison and Fitchburg in 2022). The 'Final_Ests_MCD_2026'
filename is the 1/1/2026 final release (published October 2026).
"""

