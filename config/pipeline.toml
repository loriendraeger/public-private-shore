# Pipeline tunables. Passed to SQL as psql variables (e.g. -v crs=3071) by `shore sql`.
# Keys must be unique across sections (they become flat psql variable names).

[study_area]
# What we analyze: shore whose land side lies in these municipalities (names exactly
# as in the county Municipal Boundaries layer). Chosen 2026-10-17 on the map: central
# Dane County around the Yahara lakes, plus Stoughton and the Village of Oregon.
municipalities = [
    "City of Fitchburg", "City of Madison", "City of Middleton", "City of Monona",
    "City of Stoughton", "City of Sun Prairie", "City of Verona",
    "Village of Cottage Grove", "Village of Cross Plains", "Village of Dane",
    "Village of DeForest", "Village of Maple Bluff", "Village of McFarland",
    "Village of Oregon", "Village of Shorewood Hills", "Village of Waunakee",
    "Village of Windsor",
    "Town of Blooming Grove", "Town of Bristol", "Town of Burke", "Town of Cottage Grove",
    "Town of Dane", "Town of Dunn", "Town of Middleton", "Town of Pleasant Springs",
    "Town of Springfield", "Town of Sun Prairie", "Town of Verona", "Town of Vienna",
    "Town of Westport",
]

# Load-time bounding boxes only (whole county; staging stays county-wide).
bbox_3071 = [533141, 263801, 600599, 313653]   # SCO V12 Dane parcel extent
bbox_4326 = [-89.85, 42.83, -88.99, 43.30]      # padded Dane County, for osmium

[analysis]
# NAD83(HARN) / Wisconsin Transverse Mercator, meters. Matches the SCO V12 parcels.
crs = 3071

# Which water becomes shoreline (decision 2026-10-18), set in 10_staging/30_hydro.sql:
# - named water: every lake, pond and polygon river the county or the DNR names, any
#   size, plus unnamed pieces of it (>= pond_min_area_m2) that OpenStreetMap names.
# - ponds: other standalone water of at least pond_min_area_m2, named or not (OSM name
#   as a label, else "Unnamed pond"). Ponds are their own water type: the scorecard
#   chooses whether to count them, so a municipality that rings its stormwater ponds
#   with parks gets credit and one that backs them with private lots doesn't, without
#   the pipeline judging which ponds "matter". Smaller unnamed water is out.
pond_min_area_m2 = 10000

# Shoreline smoothing (20_analysis/20_shoreline.sql), before anything is measured:
# 1. Visvalingam-Whyatt simplification drops vertices whose triangle with their
#    neighbors is smaller than shore_simplify_area_m2: digitizing jitter (Tiedeman Pond
#    has a vertex every 0.9 m) and thin needle spikes.
# 2. ST_Segmentize to edges of at most shore_smooth_max_edge_m, so step 3 can't cut a
#    long straight edge's corner by more than about a quarter of this.
# 3. Chaikin corner cutting, shore_smooth_iterations passes (each replaces every corner
#    with points 1/4 and 3/4 along its edges).
# Tested 2026-10-18 (relative to the raw lines): 1 m2 left visible 3-5 m wiggles on
# Tiedeman Pond's marsh edge. 10 m2: total shore 750 -> 735 km (-2%), half the lines
# move < 2 m, 99% < 8 m, max 13 m (inside snap_tolerance_m). 20 m2 moved 1% of lines
# 15 m+, erasing small coves.
shore_simplify_area_m2 = 10
shore_smooth_max_edge_m = 8
shore_smooth_iterations = 2

# Max distance (m) between a shoreline and a parcel for that parcel to "own" it.
# Wingra (2026-10-17): 15 m is the smallest value that closes every small-inlet gap
# (max 13 m), while the real ROW gap at the NE corner stays (117 m at 5, 81 at 15,
# 51 and fragmenting at 25). Re-check on denser shores (Mendota, Monona).
snap_tolerance_m = 15

# How a shore step finds its parcel (30_shore_segments.sql, decision 2026-10-18):
# "inland" = a fan of rays inland (perpendicular, +-snap_fan_deg), snap_tolerance_m long;
# the nearest parcel hit wins. "nearest" = the nearest parcel in any direction (the old
# way: lots beside a street end claimed it). The inland side is found by probing
# snap_direction_m to each side for water; the shore direction is taken over the same
# distance either way along the line.
snap_method = "inland"
snap_fan_deg = 15
snap_direction_m = 5

# Segmentation samples the shoreline every sample_step_m and assigns each step to the
# nearest parcel within snap_tolerance_m. Segment ends are accurate to about this much.
sample_step_m = 1

# Absorb short runs (30_shore_segments.sql): an owner or narrow/wide run of 1 m steps
# shorter than this takes its neighbor's value, so a parcel corner poking within the
# snap tolerance for 3 m, or a 2 m narrow blip at a pond inlet, doesn't become its own
# segment. Gaps (no parcel) are exempt: they may be street ends, which can be short.
segment_min_run_m = 10

# Unparceled shoreline (a gap) is road right-of-way when an OSM road is this close;
# otherwise it's unknown. The Wingra NE-corner gap reaches 37 m from parcels, with
# roads/paths within 25 m.
row_road_distance_m = 30

# OSM access evidence (parks, beaches, slipways, ...) applies to segments this close.
access_evidence_distance_m = 15

# Public land (or a parcel gap) still unknown is open when an OSM park or nature reserve is
# this close, even if it doesn't cover half the segment (60_access.sql, step 3c).
nearby_evidence_m = 50

# Public land with unknown access is open when a public footpath or cycleway is this
# close. Unknown public shore (2026-10-18): 25.6 km has a path within 10 m, 7.2 km at
# 10-20 m and only 1.6 km at 20-30 m, then 8 km at 30-50 m (paths behind houses or
# along roads rather than at the shore).
path_access_distance_m = 30

# Railway barriers (60_access.sql): a shore point is cut off when every public way
# within barrier_distance_m is across the tracks from it, or when the tracks are within
# rail_shore_m (the land in between is railroad corridor; 10 m also covers the shoreline
# smoothing, which moves lines up to ~8 m).
barrier_distance_m = 50
rail_shore_m = 10
# Barrier segments shorter than this are slivers where a segment ends at the tracks
# (two 1 m pieces on Nine Springs Creek); they keep their access.
barrier_min_length_m = 5

# A still-unknown segment shorter than this, between two segments with the same owner
# class, label and (known) access, takes theirs (60_access.sql, decision 2026-10-18).
# 10 m: catches 12 segments (38 m); 20 m would be 17 (108 m).
neighbor_fill_max_m = 10

# Rail causeways (20_shoreline.sql): land narrower than this with water on both sides
# and at least causeway_min_length_m of railway on it isn't shore (like an unbridged
# island). Monona Bay's rail crossing is ~20 m wide; the John Nolen Drive causeway, with
# the road and the trail, is wider and stays.
causeway_max_width_m = 30
causeway_min_length_m = 50

# Narrow water (decision 2026-10-17): where the water is narrower than this, the two
# banks collapse onto the stream's centerline (Dane County Rivers and Streams lines) and
# count once, with access if EITHER bank has it. Width is local: the diameter of the
# largest circle that fits in the water there (morphological opening, 25_narrow_water.sql).
# 30 m (was 20): most creeks here are 6-15 m wide; at 10/20/30/50 m, 38/55/59/63% of
# all shore is narrow, so the curve flattens after 20. 20 left the Yahara through
# Cherokee Marsh (20-26 m wide after smoothing) as two banks between collapsed reaches;
# 30 adds only ~6 km of centerline, most of it that reach.
narrow_width_m = 30

# The width is measured along each centerline every narrow_measure_step_m, smoothed with
# a rolling median over narrow_smoothing_m (one wide bend or pool doesn't break up a
# narrow reach), and narrow/wide runs shorter than narrow_min_run_m take their
# neighbor's class. Stops the Yahara in Cherokee Marsh flickering between two banks and
# one line.
narrow_measure_step_m = 5
narrow_smoothing_m = 100
narrow_min_run_m = 100

# A centerline point looks for the bank segment on each side within this distance.
# Half the narrow width plus slack for centerlines that aren't centered.
stream_bank_distance_m = 25

# Centerline runs shorter than this take the result of the run before them (80_streams.sql):
# without it, 499 centerline pieces were under 5 m (the better bank flips whenever
# either bank changes owner). 0 turns it off.
stream_min_run_m = 10

# When a stream's banks differ, the one earlier in this list wins (access first, then
# unknown, since unknown may still be open).
stream_category_priority = ["municipal", "county", "state_federal", "university", "land_trust", "other_public", "private_public_access", "unknown", "public_no_access", "private"]

[tiles]
minzoom = 10
maxzoom = 16           # shore lines; overzoomed beyond this by MapLibre
basemap_maxzoom = 15   # keeps basemap.pmtiles under the ~50 MB budget (check on change)
basemap_buffer_m = 2000   # basemap covers the study area plus this margin
# Layers written by `make compare`. Left out of the tiles unless asked for
# (`make tiles COMPARE=1`), so a leftover comparison never ships to the site.
compare_layers = ["shore_alt"]
attribution = "Dane County LIO; WI DNR; SCO V12 parcels; © OpenStreetMap contributors"

# Which exported layers go into which site/public/data/<name>.pmtiles. shore.pmtiles holds
# only the analysis output, so its bounds are the study area (the map fits to them);
# context layers cover the whole county and change rarely.
[tiles.files]
shore = ["shore", "shore_alt", "parks"]
context = ["municipalities", "municipality_labels"]
