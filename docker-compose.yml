name: public-private-shore

# PostGIS plus the pipeline tools container.
services:
  db:
    # Multi-arch build by a postgis/postgis maintainer; the official image is amd64-only.
    image: imresamu/postgis:17-3.5
    environment:
      POSTGRES_USER: ${PGUSER:-shore}
      POSTGRES_PASSWORD: ${PGPASSWORD:-shore}
      POSTGRES_DB: ${PGDATABASE:-shore}
    ports:
      - "${PGPORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 20

  # Tools container. Not started by `up`; the Makefile calls `docker compose run`.
  pipeline:
    build: ./pipeline
    profiles: ["tools"]
    env_file: .env
    environment:
      PGHOST: db
      PGPORT: 5432
    volumes:
      - .:/work
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
